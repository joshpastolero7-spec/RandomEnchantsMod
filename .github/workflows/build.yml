name: Build Minecraft Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip mod source
        run: unzip RandomEnchantsMod.zip

      - name: Download Forge MDK
        run: |
          wget -q https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.2.0/forge-1.20.1-47.2.0-mdk.zip -O forge-mdk.zip
          unzip forge-mdk.zip -d forge-mdk

      - name: Copy mod files into MDK
        run: |
          cp -r RandomEnchantsMod/src forge-mdk/
          cp RandomEnchantsMod/build.gradle forge-mdk/build.gradle
          cp RandomEnchantsMod/settings.gradle forge-mdk/settings.gradle
          cp RandomEnchantsMod/gradle.properties forge-mdk/gradle.properties

      - name: Grant execute permission for gradlew
        run: chmod +x forge-mdk/gradlew

      - name: Build mod
        working-directory: forge-mdk
        run: ./gradlew build --no-daemon

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v3
        with:
          name: RandomEnchantsMod-JAR
          path: forge-mdk/build/libs/*.jar
